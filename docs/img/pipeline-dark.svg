<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1044" viewBox="0 0 460 1044" role="img" aria-label="The sdlight pipeline, from idea to feature doc">
<title>The sdlight pipeline, from idea to feature doc</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect x="0.5" y="0.5" width="459" height="1043" rx="12" fill="#0d1117" stroke="#30363d"/>
