<text x="198.0" y="633.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c7d2fe" text-anchor="middle" fill-opacity="0.8">one commit per step</text>
<polygon points="72,674 324,674 338,700.0 324,726 72,726 58,700.0" fill="#3a1519" stroke="#f85149" stroke-width="1.5"/>
<text x="198.0" y="697.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#ffa198" text-anchor="middle" >step review</text>
<text x="198.0" y="715.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffa198" text-anchor="middle" fill-opacity="0.8">diff vs that step</text>
<polygon points="72,756 324,756 338,782.0 324,808 72,808 58,782.0" fill="#3a1519" stroke="#f85149" stroke-width="1.5"/>
<text x="198.0" y="779.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#ffa198" text-anchor="middle" >final review</text>
<text x="198.0" y="797.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffa198" text-anchor="middle" fill-opacity="0.8">code vs spec</text>
<rect x="58" y="838" width="280" height="52" rx="8" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.5"/>
<text x="198.0" y="861.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="600" fill="#c7d2fe" text-anchor="middle" >sdlc-promote</text>
<text x="198.0" y="879.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c7d2fe" text-anchor="middle" fill-opacity="0.8">writes the feature doc</text>
<rect x="58" y="930" width="280" height="52" rx="26.0" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/>
<text x="198.0" y="953.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#f2cc60" text-anchor="middle" >Feature doc</text>
<text x="198.0" y="971.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#f2cc60" text-anchor="middle" fill-opacity="0.8">seed and spec are deleted</text>
