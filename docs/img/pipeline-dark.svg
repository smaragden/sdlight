<rect x="58" y="136" width="280" height="52" rx="8" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.5"/>
<text x="198.0" y="159.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="600" fill="#c7d2fe" text-anchor="middle" >seed-capture</text>
