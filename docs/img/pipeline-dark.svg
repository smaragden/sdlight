<text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="0.08em">YOU DECIDE</text>
<rect x="16" y="392" width="428" height="516" rx="10" fill="#161b22"/>
