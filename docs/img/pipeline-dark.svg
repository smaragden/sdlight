<text x="198.0" y="259.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c7d2fe" text-anchor="middle" fill-opacity="0.8">explores routes, writes a spec</text>
<rect x="58" y="300" width="280" height="52" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/>
<text x="198.0" y="323.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e6edf3" text-anchor="middle" >You read the spec</text>
<text x="198.0" y="341.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="middle" fill-opacity="0.8">then ask for a plan</text>
<rect x="58" y="428" width="280" height="52" rx="8" fill="#1e1f3b" stroke="#818cf8" stroke-width="1.5"/>
